<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f3f6" id="metaTheme">

<style>
  html,
  body {
    margin: 0;
    background: #f7f6f3;
    color: #2b2925;
  }
  #boot {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #f7f6f3;
    color: #3d3a35;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    transition: opacity 0.32s ease;
  }
  #boot .boot-mark {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: #2b2925;
  }
  #boot .boot-mark span {
    color: #c15f3c;
  }
  #boot .boot-sub {
    font-size: 13px;
    color: #8a857d;
  }
  #boot .boot-dots {
    display: flex;
    gap: 5px;
    margin-top: 2px;
  }
  #boot .boot-dots i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #c9c4bb;
    animation: bootPulse 1.2s infinite ease-in-out;
  }
  #boot .boot-dots i:nth-child(2) {
    animation-delay: 0.15s;
  }
  #boot .boot-dots i:nth-child(3) {
    animation-delay: 0.3s;
  }
  @keyframes bootPulse {
    0%,
    80%,
    100% {
      opacity: 0.35;
      transform: translateY(0);
    }
    40% {
      opacity: 1;
      transform: translateY(-2px);
    }
  }
  #boot .boot-note {
    font-size: 12px;
    color: #a39d94;
    min-height: 18px;
  }
  #boot .boot-retry {
    margin-top: 4px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 0.5px solid #d8d2c9;
    background: transparent;
    color: #3d3a35;
    font: inherit;
    font-size: 13px;
  }
  #boot .boot-retry:active {
    background: #efece6;
  }
  #boot .boot-version {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom));
    font-size: 11px;
    color: #b5afa6;
    letter-spacing: 0.02em;
  }
  @media (prefers-color-scheme: dark) {
    html,
    body,
    #boot {
      background: #1b1a18;
      color: #ecebe8;
    }
    #boot .boot-mark {
      color: #ecebe8;
    }
    #boot .boot-sub {
      color: #8f8a82;
    }
    #boot .boot-note {
      color: #7d7871;
    }
    #boot .boot-retry {
      border-color: #3a3833;
      color: #ecebe8;
    }
    #boot .boot-retry:active {
      background: #262420;
    }
  }
</style>
<link rel="preload" href="styles.css?v=20261109h" as="style" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" href="theme-flat.css?v=20261109h" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript>

</noscript>
<script>
  (function () {
    var ready = false;
    function hide() {
      var boot = document.getElementById("boot");
      if (!boot) return;
      boot.style.opacity = "0";
      setTimeout(function () {
        var el = document.getElementById("boot");
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }, 320);
    }
    function problem(text) {
      if (ready) return;
      var note = document.getElementById("bootNote");
      var retry = document.getElementById("bootRetry");
      if (note && text) note.textContent = text;
      if (retry) retry.hidden = false;
    }
    window.__kpaoBootReady = function () {
      if (new URLSearchParams(location.search).get("boot") === "1") return;
      ready = true;
      hide();
    };
    window.__kpaoHeartbeat = function () {
      window.__kpaoLastBeat = Date.now();
    };
    window.addEventListener(
      "error",
      function () {
        problem("加载出错了，点下面重新加载");
      },
      true
    );
    window.addEventListener("unhandledrejection", function () {
      problem("加载出错了，点下面重新加载");
    });
    setTimeout(function () {
      problem("网络有点慢，可以点下面重新加载");
    }, 6000);
    setTimeout(function () {
      if (!ready) problem("还是没连上，点下面重新加载");
    }, 12000);
    document.addEventListener("DOMContentLoaded", function () {
      var version = document.getElementById("bootVersion");
      if (version) {
        var search = new URLSearchParams(location.search);
        version.textContent = search.get("v") ? "v" + search.get("v") : "";
      }
      var retry = document.getElementById("bootRetry");
      if (retry) {
        retry.addEventListener("click", function () {
          var params = new URLSearchParams(location.search);
          location.replace(
            location.pathname +
              "?v=" +
              encodeURIComponent(params.get("v") || "") +
              "&r=" +
              Date.now() +
              location.hash
          );
        });
      }
    });
    // 页面已起来但长时间没有任何心跳：自动重载一次（5 分钟内最多一次）
    setInterval(function () {
      if (!ready || document.visibilityState !== "visible") return;
      var last = window.__kpaoLastBeat || 0;
      if (last === 0 || Date.now() - last < 120000) return;
      var at = 0;
      try {
        at = Number(localStorage.getItem("kpao-auto-reload") || 0);
      } catch {}
      if (Date.now() - at < 300000) return;
      try {
        localStorage.setItem("kpao-auto-reload", String(Date.now()));
      } catch {}
      location.reload();
    }, 15000);
  })();
</script>
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="boot-mark">KPAO<span>.</span></div>

              <span class="menu-ic ic-muted"><svg class="ic"><use href="#i-bell"/></svg></span>
              <span class="menu-label">Bot 完成时通知<span class="menu-sub">原型占位</span></span>
              <button class="switch" role="switch" aria-checked="false" aria-label="通知" data-act="toast" data-toast="通知需要系统级权限，正式版再接"><i></i></button>
            </div>
            <button class="menu-row" data-act="design-note">
              <span class="menu-ic ic-muted"><svg class="ic"><use href="#i-info"/></svg></span>
              <span class="menu-label">设计说明</span>
              <span class="menu-value">v0.3</span>
              <svg class="ic chev"><use href="#i-chev"/></svg>
            </button>
            <button class="menu-row" data-act="features">
              <span class="menu-ic ic-muted"><svg class="ic"><use href="#i-flow"/></svg></span>
              <span class="menu-label">功能清单<span class="menu-sub">当前界面所有功能 → 新位置</span></span>
              <svg class="ic chev"><use href="#i-chev"/></svg>
            </button>
          </div>
        </div>

        <p class="version">KPAO 手机端 v0.5 · <span id="dataSource">连接中…</span><br>真实数据来自本机 DSH，仅手机网关可见</p>
        <div class="me-bottom-space"></div>
      </div>
    </section>

    <!-- ============================ 底部 Tab ============================ -->
    <nav class="tabbar" aria-label="主导航">
      <button class="tab is-active" data-tab="chats" aria-label="消息">
        <span class="tab-ic"><svg class="ic"><use href="#i-chat"/></svg><i class="tab-badge" id="tabBadge">7</i></span>
        <span class="tab-label">消息</span>
      </button>
      <button class="tab" data-tab="contacts" aria-label="通讯录">
        <span class="tab-ic"><svg class="ic"><use href="#i-contacts"/></svg></span>
        <span class="tab-label">通讯录</span>
      </button>
      <button class="tab" data-tab="me" aria-label="我的">
        <span class="tab-ic"><svg class="ic"><use href="#i-me"/></svg></span>
        <span class="tab-label">我的</span>
      </button>
    </nav>

    <!-- ============================ 聊天框（覆盖层） ============================ -->
    <section class="chat-view" id="chatView" aria-hidden="true" aria-label="聊天">
      <header class="chat-nav">
        <button class="icon-btn back" data-act="chat-back" aria-label="返回">
          <svg class="ic"><use href="#i-back"/></svg>
        </button>
        <div class="chat-id" data-act="chat-members" role="button" tabindex="0" aria-label="查看会话成员">
          <div class="avatar avatar-sm" id="chatAvatar"></div>
          <div class="chat-id-text">
            <div class="chat-name" id="chatName">—</div>
            <div class="chat-status" id="chatStatus">—</div>
          </div>
        </div>
        <button class="icon-btn" data-act="chat-more" aria-label="更多">
          <svg class="ic"><use href="#i-more"/></svg>
        </button>
      </header>

      <input id="imageInput" type="file" accept="image/*" hidden>
      <div class="chat-scroll" id="chatScroll"></div>

      <div class="live-typing" id="liveTyping" hidden>
        <span class="typing-dots"><i></i><i></i><i></i></span>
        <span class="live-typing-main">
          <span id="liveTypingText">思考中…</span>
          <span id="liveTypingMeta" class="live-typing-meta" hidden></span>
        </span>
      </div>

      <div class="deliverable-bar" id="deliverableBar" hidden data-act="deliverables">
        <svg class="ic"><use href="#i-doc"/></svg>
        <span>本轮产物 <b id="deliverableCount">0</b></span>
        <span class="go">查看</span>
      </div>
      <div class="approval-bar" id="approvalBar" hidden>有审批待处理 · 查看</div>
      <div class="card-dock" id="cardDock" hidden></div>

      <div class="composer">
        <div class="pending-image" id="pendingImage" hidden>
          <img id="pendingImageThumb" alt="待发送图片">
          <span class="pending-image-text">图片已就绪，可加文字一起发</span>
          <button class="pending-image-remove" data-act="clear-image" aria-label="移除图片">
            <svg class="ic"><use href="#i-close"/></svg>
          </button>
        </div>
        <div class="quick-row" id="quickRow"></div>
        <div class="composer-bar">
          <button class="icon-btn round" data-act="composer-plus" aria-label="更多功能">
            <svg class="ic"><use href="#i-plus"/></svg>
          </button>
          <div class="input-wrap">
            <textarea id="composerInput" rows="1" placeholder="发消息…" enterkeyhint="send" autocomplete="off"></textarea>
          </div>
          <button class="stop-btn" id="stopBtn" hidden aria-label="中断任务">
            <svg class="ic"><use href="#i-stop"/></svg>
          </button>
          <button class="send-btn" id="sendBtn" disabled aria-label="发送">
            <svg class="ic"><use href="#i-send"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div class="image-viewer" id="imageViewer" hidden aria-label="查看图片">
      <button class="image-viewer-close" data-act="close-image" aria-label="关闭">
        <svg class="ic"><use href="#i-close"/></svg>
      </button>
      <img id="imageViewerImg" alt="查看图片">
      <span class="image-viewer-hint">点击任意处关闭</span>
    </div>

    <div class="file-viewer" id="fileViewer" hidden aria-label="查看文件">
      <div class="file-viewer-panel">
        <header class="file-viewer-head">
          <div class="file-viewer-title" id="fileViewerTitle">文件</div>
          <button class="file-viewer-close" data-act="close-file" aria-label="关闭">
            <svg class="ic"><use href="#i-close"/></svg>
          </button>
        </header>
        <div class="file-viewer-body" id="fileViewerBody"></div>
        <footer class="file-viewer-foot">
          <a class="btn" id="fileViewerRaw" href="#" target="_blank" rel="noreferrer noopener">下载 / 打开原文件</a>
        </footer>
      </div>
    </div>

    <!-- ============================ 底部弹层 ============================ -->
    <div class="sheet-layer" id="sheetLayer" hidden>
      <div class="sheet-backdrop" data-act="sheet-close"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <p class="stage-meta">移动端交互原型 · 390 × 844 · 比例已锁定</p>
</div>

<script src="data.js?v=20261109h"></script>
<script src="app.js?v=20261109h"></script>
</body>
</html>
