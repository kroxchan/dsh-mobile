<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2b44"/>
      <stop offset="0.48" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#0a101b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(760 170) rotate(130) scale(620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7be0c1" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#7be0c1" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#7be0c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cream" x1="280" y1="230" x2="760" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf0"/>
      <stop offset="0.55" stop-color="#f2e9da"/>
      <stop offset="1" stop-color="#dfd2be"/>
    </linearGradient>
    <linearGradient id="coral" x1="500" y1="465" x2="600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffb07c"/>
      <stop offset="1" stop-color="#f06b4f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="222.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- orbit -->
  <path d="M742 238C835 292 890 380 900 480" fill="none" stroke="#7be0c1" stroke-opacity="0.42" stroke-width="9" stroke-linecap="round"/>
  <circle cx="905" cy="488" r="15" fill="#7be0c1"/>

  <!-- D speech bubble -->
  <path fill="url(#cream)" fill-rule="evenodd" d="
    M 300 250
    H 520
    C 700 250 820 360 820 512
    C 820 664 700 774 520 774
    H 300
    Z
    M 460 390
    H 520
    C 610 390 670 440 670 512
    C 670 584 610 634 520 634
    H 460
    Z
  "/>

  <!-- terminal caret inside the counter -->
  <path d="M 508 464 L 584 512 L 508 560" fill="none" stroke="url(#coral)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small pulse dot -->
  <circle cx="640" cy="630" r="17" fill="#7be0c1"/>
  <circle cx="640" cy="630" r="36" fill="none" stroke="#7be0c1" stroke-opacity="0.25" stroke-width="5"/>

  <!-- base shadow -->
  <ellipse cx="512" cy="890" rx="210" ry="26" fill="#000000" opacity="0.30" filter="url(#soft)"/>
</svg>
